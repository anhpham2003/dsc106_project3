<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 NDVI Heatmap Viewer</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    #heatmap {
      border: 2px solid #333;
      margin-top: 20px;
      image-rendering: pixelated;
    }

    #slider {
      width: 80%;
      margin-top: 20px;
    }

    #hover {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1 id="title">NDVI Viewer</h1>

  <canvas id="heatmap" width="800" height="600"></canvas>

  <div id="hover">Hover NDVI: —</div>

  <input type="range" id="slider" min="0" max="0" value="0">

  <script type="module" src="./main.js?v=1"></script>

</body>
</html>
