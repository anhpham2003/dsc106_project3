<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>D3 NDVI Heatmap Viewer</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    #viz-container {
      position: relative;
      display: inline-block;
    }

    #heatmap {
      border: 2px solid #333;
      margin-top: 20px;
    }

    #popup {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      max-width: 60%;
      text-align: center;
    }

    #slider {
      width: 80%;
      margin-top: 20px;
    }

    #hover {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1 id="title">NDVI Viewer</h1>

  <!-- Canvas + Popup Overlay -->
  <div id="viz-container">
    <canvas id="heatmap" width="1200" height="900"></canvas>

    <div id="popup"></div>
  </div>

  <div id="hover">Hover NDVI: —</div>

  <input type="range" id="slider" min="0" max="0" value="0">

  <script type="module" src="./main.js?v=1"></script>

</body>

</html>
