<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>D3 NDVI Heatmap Viewer</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    #viz-container {
      position: relative;
      display: inline-block;
    }

    #heatmap {
      border: 2px solid #333;
      margin-top: 20px;
    }

    #popup {
      position: absolute;
      max-width: 320px;

      background: #fef9c3;
      border: 1px solid #e9d84a;
      border-radius: 2px 12px 12px 12px;
      padding: 16px 20px 18px;
      box-shadow: 3px 4px 0px #d4c43a;

      color: #4a3f00;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      text-align: left;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #popup::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 22px 22px 0 0;
      border-color: #d4c43a transparent transparent transparent;
    }

    #popup::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 20px 20px 0 0;
      border-color: #f5f5f5 transparent transparent transparent;
    }

    #popup.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0px);
    }

    #slider {
      width: 80%;
      margin-top: 20px;
    }

    #hover {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1 id="title">NDVI Viewer</h1>

  <!-- Canvas + Popup Overlay -->
  <div id="viz-container">
    <canvas id="heatmap" width="1200" height="900"></canvas>

    <div id="popup"></div>
  </div>

  <div id="hover">Hover NDVI: —</div>

  <input type="range" id="slider" min="0" max="0" value="0">

  <script type="module" src="./main.js?v=1"></script>

</body>

</html>
